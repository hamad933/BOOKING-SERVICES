name: RP03 Automation Shadow Read

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/rp03_automation/**'
      - 'tests/rp03_automation/**'
      - '.github/workflows/rp03-automation-foundation.yml'
      - '.github/workflows/rp03-automation-shadow-read.yml'
      - 'docs/RP03_AUTOMATION_GATEWAY.md'
  push:
    branches: [main]
    paths:
      - 'tools/rp03_automation/live_probe_request.json'
  workflow_dispatch:
    inputs:
      live_probe:
        description: 'Run bounded live GET-only Jules probe'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rp03-automation-shadow-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-shadow-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce bounded W02 paths on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          mapfile -t changed < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              tools/rp03_automation/*|tests/rp03_automation/*|.github/workflows/rp03-automation-foundation.yml|.github/workflows/rp03-automation-shadow-read.yml|docs/RP03_AUTOMATION_GATEWAY.md) ;;
              *) echo "OUT_OF_SCOPE_PATH=$path" >&2; exit 1 ;;
            esac
          done
      - name: Validate Git whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git diff --check
          fi
      - name: Compile automation modules
        run: python -m compileall -q tools/rp03_automation tests/rp03_automation
      - name: Run deterministic automation tests
        run: python -m unittest discover -s tests/rp03_automation -v
      - name: Prove Shadow Read has no provider mutation request construction
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('tools/rp03_automation/shadow_read.py').read_text())
          bad = []
          for node in ast.walk(tree):
              if not isinstance(node, ast.Call):
                  continue
              for kw in node.keywords:
                  if kw.arg == 'method' and isinstance(kw.value, ast.Constant) and kw.value.value in {'POST','PUT','PATCH','DELETE'}:
                      bad.append((node.lineno, kw.value.value))
          if bad:
              raise SystemExit(f'Provider mutation request construction found: {bad}')
          print('GET_ONLY_REQUEST_CONSTRUCTION_PROVEN')
          PY

  live-shadow-read:
    if: (github.event_name == 'workflow_dispatch' && inputs.live_probe) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: validate-shadow-read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate governed main-only probe request
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          data = json.loads(Path('tools/rp03_automation/live_probe_request.json').read_text())
          assert data == {
              'schema_version': '1.0',
              'request_id': data['request_id'],
              'action': 'GET_ONLY_SHADOW_PROBE',
              'repository': 'hamad933/BOOKING-SERVICES',
              'expected_parent_sha': os.environ['EXPECTED_BEFORE'],
              'provider_mutation_authorized': False,
          }
          assert re.fullmatch(r'RP03-AUTO-W02-LIVE-[A-Za-z0-9._:-]{1,96}', data['request_id'])
          assert re.fullmatch(r'[0-9a-f]{40}', data['expected_parent_sha'])
          print('MAIN_ONLY_PROBE_REQUEST_BINDING_PROVEN')
          PY
      - name: Require provisioned Jules API key without printing it
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${JULES_API_KEY:-}" ]; then
            echo 'JULES_API_KEY_NOT_CONFIGURED'
            exit 3
          fi
      - name: Run bounded live GET-only RP03 probe and preserve sanitized outcome
        id: provider_probe
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          from tools.rp03_automation.shadow_read import ProviderHTTPError, ShadowReadError, ShadowReader

          reader = ShadowReader(os.environ['JULES_API_KEY'])
          try:
              receipt = reader.probe()
              code = 0
          except ShadowReadError as exc:
              receipt = {
                  'schema_version': '1.0',
                  'project_id': 'RP03',
                  'route': 'RP03',
                  'repository': 'hamad933/BOOKING-SERVICES',
                  'observed_at': datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
                  'status': type(exc).__name__,
                  'provider_http_status': exc.status if isinstance(exc, ProviderHTTPError) else None,
                  'provider_read_complete': False,
                  'source_binding': 'UNPROVEN',
                  'requests_performed': reader.request_count,
                  'bytes_read': reader.bytes_read,
                  'provider_mutation_performed': False,
                  'external_effects_dispatched': 0,
                  'new_tasks_or_sessions_created': 0,
                  'safe_to_blind_retry': False,
              }
              code = 2
          Path('rp03-shadow-read-receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')),
              encoding='utf-8',
          )
          raise SystemExit(code)
          PY
      - name: Validate sanitized receipt envelope
        id: receipt_guard
        if: always() && hashFiles('rp03-shadow-read-receipt.json') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('rp03-shadow-read-receipt.json').read_text())
          assert data['schema_version'] == '1.0'
          assert data['project_id'] == 'RP03'
          assert data['route'] == 'RP03'
          assert data['repository'] == 'hamad933/BOOKING-SERVICES'
          assert data['provider_mutation_performed'] is False
          assert data['external_effects_dispatched'] == 0
          assert data['new_tasks_or_sessions_created'] == 0
          assert data['safe_to_blind_retry'] is False
          if data['provider_read_complete'] is True:
              assert data['source_binding'] == 'SOURCE_BINDING_PROVEN'
          else:
              assert data['source_binding'] == 'UNPROVEN'
              assert data['status'] in {
                  'ProviderHTTPError', 'BudgetExceeded', 'PaginationError',
                  'SourceBindingError', 'UnsafeProviderRequest', 'ShadowReadError'
              }
              value = data.get('provider_http_status')
              assert value is None or (isinstance(value, int) and 400 <= value <= 599)
          encoded = json.dumps(data, sort_keys=True)
          for forbidden in ('x-goog-api-key', 'authorization', 'prompt', 'session_id', 'raw_session_id'):
              assert forbidden not in encoded.casefold()
          print('SANITIZED_SHADOW_READ_RECEIPT_VALID')
          PY
      - name: Upload sanitized Shadow Read receipt
        if: always() && steps.receipt_guard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rp03-shadow-read-${{ github.sha }}
          path: rp03-shadow-read-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Propagate live probe failure after evidence persistence
        if: always() && steps.provider_probe.outcome == 'failure'
        shell: bash
        run: |
          echo 'LIVE_GET_FAILED_RECEIPT_PRESERVED'
          exit 2
