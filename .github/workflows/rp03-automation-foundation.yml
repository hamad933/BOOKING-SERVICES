name: RP03 Automation Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/rp03_automation/**'
      - 'tests/rp03_automation/**'
      - '.github/workflows/rp03-automation-foundation.yml'
      - 'docs/RP03_AUTOMATION_GATEWAY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rp03-automation-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce bounded changed paths on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          mapfile -t changed < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              tools/rp03_automation/*|tests/rp03_automation/*|.github/workflows/rp03-automation-foundation.yml|docs/RP03_AUTOMATION_GATEWAY.md) ;;
              *) echo "OUT_OF_SCOPE_PATH=$path" >&2; exit 1 ;;
            esac
          done

      - name: Compile foundation
        run: python -m compileall -q tools/rp03_automation tests/rp03_automation

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests/rp03_automation -v

      - name: Prove foundation contains no provider transport
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'jules\.googleapis\.com|x-goog-api-key|urllib\.request|requests\.(get|post|put|patch|delete)' tools/rp03_automation --include='*.py'; then
            echo 'Provider transport code is prohibited in W01 foundation.' >&2
            exit 1
          fi
