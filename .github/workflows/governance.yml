name: Governance Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Validate repository governance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record requested Git validation
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          git branch --force main "$BASE_SHA"

          echo "::group::git status --short"
          git status --short
          echo "::endgroup::"

          echo "::group::git diff --check"
          git diff --check
          echo "::endgroup::"

          echo "::group::git diff --check main...HEAD"
          git diff --check main...HEAD
          echo "::endgroup::"

          echo "::group::git diff --name-only main...HEAD"
          git diff --name-only main...HEAD
          echo "::endgroup::"

          echo "::group::git log --oneline --decorate --max-count=10"
          git log --oneline --decorate --max-count=10
          echo "::endgroup::"

      - name: Verify required governance files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            ".gitignore"
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            ".github/pull_request_template.md"
            ".github/workflows/governance.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required governance file: $file" >&2
              exit 1
            fi

            if [[ ! -s "$file" ]]; then
              echo "Required governance file is empty: $file" >&2
              exit 1
            fi
          done

      - name: Verify governing contract terms
        shell: bash
        run: |
          set -euo pipefail

          require_term() {
            local file="$1"
            local term="$2"

            if ! grep -Fq "$term" "$file"; then
              echo "Missing required term '$term' in $file" >&2
              exit 1
            fi
          }

          require_term AGENTS.md "Bounded Workstream Contract"
          require_term AGENTS.md "Google Drive governed RP03 state"
          require_term AGENTS.md "RP03 static control pack"
          require_term AGENTS.md "Conversation memory"
          require_term AGENTS.md "PROJECT_ID"
          require_term AGENTS.md "WORKSTREAM_ID"
          require_term AGENTS.md "Execution Handoff"
          require_term AGENTS.md "RP03 Central Controller"
          require_term AGENTS.md "PHP 8.x + SQLite 3 + PDO_SQLITE"
          require_term AGENTS.md "semantic HTML + plain CSS + browser-native JavaScript"
          require_term AGENTS.md "No framework or ORM is approved by default."
          require_term AGENTS.md "SINGLE_HOST_LOCAL_DURABLE_STORAGE"
          require_term AGENTS.md "Database/schema/migration work requires an explicitly authorized workstream."
          require_term AGENTS.md "migrations must be numbered and immutable after acceptance"
          require_term AGENTS.md "migrations must never run automatically from normal HTTP requests"
          require_term AGENTS.md "destructive migrations require separate explicit authority"
          require_term AGENTS.md "Server-side authorization is authoritative; client route guards remain UX only."
          require_term AGENTS.md "Booking/schedule authority changes require transaction and concurrency evidence."
          require_term AGENTS.md "Production data is prohibited in normal development/testing."

          require_term CONTRIBUTING.md "Workstream Contract"
          require_term CONTRIBUTING.md "main"
          require_term CONTRIBUTING.md "pull request"
          require_term CONTRIBUTING.md "Authorized Paths"
          require_term CONTRIBUTING.md "Execution Handoff"
          require_term CONTRIBUTING.md "Central Controller"
          require_term CONTRIBUTING.md "Google Drive"
          require_term CONTRIBUTING.md "PHP syntax validation"
          require_term CONTRIBUTING.md "real SQLite integration tests"
          require_term CONTRIBUTING.md "empty database"
          require_term CONTRIBUTING.md "prior supported schema"
          require_term CONTRIBUTING.md "transaction rollback evidence"
          require_term CONTRIBUTING.md "concurrency test for competing exclusive-slot confirmation"
          require_term CONTRIBUTING.md "authorization negative tests"
          require_term CONTRIBUTING.md "Exact-head CI evidence"

      - name: Verify canonical architecture and status truth
        shell: bash
        run: |
          set -euo pipefail

          require_readme() {
            local term="$1"
            if ! grep -Fq "$term" README.md; then
              echo "Missing canonical README truth: $term" >&2
              exit 1
            fi
          }

          require_readme "RP03 — Booking & Services"
          require_readme "Product implementation status: IN PROGRESS."
          require_readme "Real RP03 S01-S12 UI implementation is present in the repository"
          require_readme "Production foundation design status: APPROVED."
          require_readme "Production foundation implementation status: NOT STARTED."
          require_readme "semantic HTML + plain CSS + browser-native JavaScript"
          require_readme "supported PHP 8.x release at implementation time"
          require_readme "SQLite 3"
          require_readme "PDO_SQLITE"
          require_readme "parameterized SQL and no ORM"
          require_readme "same-origin HTTP/JSON only where authoritative server behavior is required"
          require_readme "SINGLE_HOST_LOCAL_DURABLE_STORAGE"
          require_readme "No framework or ORM is approved by default."
          require_readme "Architecture approval records technical direction; it does not itself authorize deployment"
          require_readme "RP03-DQ-004"
          require_readme "RP03-DQ-005"
          require_readme "RP03-DQ-006"
          require_readme "RP03-DQ-007"
          require_readme "RP03-DQ-012"
          require_readme "RP03-DQ-013"

          if grep -Fq "Product implementation status: NOT STARTED." README.md; then
            echo "README contains the stale NOT STARTED status for the already-existing S01-S12 product UI." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*(PRODUCT|RELEASE|DEPLOYMENT|PRODUCTION)[[:space:]_-]+READY[[:space:][:punct:]]*$' README.md; then
            echo "README contains a readiness declaration." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*\*{0,2}(Product|Release|Deployment|Production)[[:space:]]+(status|readiness)\*{0,2}:[[:space:]]*\*{0,2}(READY|COMPLETE|APPROVED_FOR_RELEASE|APPROVED_FOR_DEPLOYMENT|PRODUCTION_READY)\*{0,2}[[:space:][:punct:]]*$' README.md; then
            echo "README claims product/release/deployment/production readiness." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]-]*(framework|orm)[[:space:]]*:[[:space:]]*[A-Za-z0-9_.+-]+' README.md AGENTS.md CONTRIBUTING.md; then
            echo "Governance files appear to select a framework or ORM." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]-]*(production[[:space:]]+database|database|persistence)[[:space:]]*:[[:space:]]*(PostgreSQL|MySQL|MariaDB|SQL[[:space:]]+Server|Oracle|MongoDB|DynamoDB|CockroachDB)\b' README.md AGENTS.md CONTRIBUTING.md; then
            echo "Governance files appear to substitute an unapproved production database." >&2
            exit 1
          fi

          for dq in RP03-DQ-004 RP03-DQ-005 RP03-DQ-006 RP03-DQ-007 RP03-DQ-012 RP03-DQ-013; do
            if ! grep -Eiq "\`${dq}\`[[:space:]]+—[[:space:]]+UNRESOLVED" README.md; then
              echo "README no longer marks $dq as unresolved." >&2
              exit 1
            fi
          done

          if grep -Eiq '^[[:space:]-]*(identity|identity provider|payment|payment provider|notification|notification provider|remote-session|remote session)[[:space:]]+(policy|provider|model)?[[:space:]]*:[[:space:]]*(SETTLED|APPROVED|SELECTED|FINAL)\b' README.md AGENTS.md CONTRIBUTING.md; then
            echo "Governance files appear to settle an unresolved identity/payment/notification/remote-session policy." >&2
            exit 1
          fi

      - name: Verify SQLite runtime ignore protection
        shell: bash
        run: |
          set -euo pipefail

          required_ignores=(
            "*.db"
            "*.db-wal"
            "*.db-shm"
            "*.sqlite"
            "*.sqlite-wal"
            "*.sqlite-shm"
            "*.sqlite3"
            "*.sqlite3-wal"
            "*.sqlite3-shm"
          )

          for pattern in "${required_ignores[@]}"; do
            if ! grep -Fxq "$pattern" .gitignore; then
              echo "Missing SQLite runtime ignore rule: $pattern" >&2
              exit 1
            fi
          done

          grep -Fxq ".env" .gitignore
          grep -Fxq ".env.*" .gitignore
          grep -Fxq "!.env.example" .gitignore

      - name: Verify diff hygiene and bounded path boundaries
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ -n "${BASE_SHA:-}" ]]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            echo "No pull-request base SHA is available; diff whitespace check skipped."
          fi

          if [[ "${HEAD_BRANCH:-}" == "chore/rp03-governance-bootstrap" ]]; then
            authorized_paths=(
              ".gitignore"
              "README.md"
              "AGENTS.md"
              "CONTRIBUTING.md"
              ".github/pull_request_template.md"
              ".github/workflows/governance.yml"
            )

            mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA"...HEAD)

            for path in "${changed_paths[@]}"; do
              authorized=false

              for allowed in "${authorized_paths[@]}"; do
                if [[ "$path" == "$allowed" ]]; then
                  authorized=true
                  break
                fi
              done

              if [[ "$authorized" != true ]]; then
                echo "Unauthorized bootstrap path: $path" >&2
                exit 1
              fi
            done
          fi

          if [[ "${HEAD_BRANCH:-}" == "chore/rp03-governance-status-remediation" ]]; then
            authorized_paths=(
              ".github/workflows/governance.yml"
              "README.md"
            )

            mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)

            if [[ "${#changed_paths[@]}" -ne "${#authorized_paths[@]}" ]]; then
              echo "Governance status remediation must change exactly the two authorized paths." >&2
              printf 'Changed path: %s\n' "${changed_paths[@]}" >&2
              exit 1
            fi

            for i in "${!authorized_paths[@]}"; do
              if [[ "${changed_paths[$i]}" != "${authorized_paths[$i]}" ]]; then
                echo "Unauthorized or missing governance-status-remediation path: ${changed_paths[$i]}" >&2
                exit 1
              fi
            done
          fi

          if [[ "${HEAD_BRANCH:-}" == "chore/rp03-production-foundation-governance" ]]; then
            authorized_paths=(
              ".github/workflows/governance.yml"
              ".gitignore"
              "AGENTS.md"
              "CONTRIBUTING.md"
              "README.md"
            )

            mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)

            if [[ "${#changed_paths[@]}" -ne "${#authorized_paths[@]}" ]]; then
              echo "RP03-GOV-REMEDIATION-003 must change exactly the five authorized paths." >&2
              printf 'Changed path: %s\n' "${changed_paths[@]}" >&2
              exit 1
            fi

            for i in "${!authorized_paths[@]}"; do
              if [[ "${changed_paths[$i]}" != "${authorized_paths[$i]}" ]]; then
                echo "Unauthorized or missing RP03-GOV-REMEDIATION-003 path: ${changed_paths[$i]:-<missing>}" >&2
                exit 1
              fi
            done

            if git diff --name-only "$BASE_SHA"...HEAD | grep -Eiq '(^|/)(migrations?|database|schema)(/|$)|\.php$|\.sql$|(^|/)(composer\.json|composer\.lock|package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$|(^|/)(adr|adrs)(/|$)|\.db(-wal|-shm)?$|\.sqlite(3)?(-wal|-shm)?$'; then
              echo "RP03-GOV-REMEDIATION-003 contains a prohibited implementation/runtime artifact." >&2
              exit 1
            fi
          fi

      - name: Confirm stack-independent validation
        shell: bash
        run: |
          set -euo pipefail
          echo "Governance validation completed without PHP tooling, database tooling, package installation, framework tooling, or product dependencies."
